# Dependabot keeps dependencies up to date and raises PRs for security fixes.
version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    # Group all non-major updates into a single PR to reduce noise.
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  # GitHub Actions (the workflow actions themselves can have vulns too)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
