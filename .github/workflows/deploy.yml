# Secure CI/CD for the Xcelliance static site.
# Lint + dependency audit gate the build; CodeQL (SAST) and OWASP ZAP (DAST)
# run in parallel; a passing build deploys to GitHub Pages.
name: CI / Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write # lets CodeQL upload results to the Security tab

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # SAST — static analysis of the source with GitHub CodeQL.
  # ------------------------------------------------------------------
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # ------------------------------------------------------------------
  # Lint + dependency audit + build. Lint and audit are hard gates.
  # ------------------------------------------------------------------
  build:
    name: Lint, Audit & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Dependency scanning — fails the run on high/critical vulnerabilities.
      - name: Audit dependencies
        run: npm run audit

      # Lint is a hard gate: no deploy on lint errors.
      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # ------------------------------------------------------------------
  # DAST — dynamic scan of the running site with OWASP ZAP baseline.
  # Runs against the locally built static output.
  # ------------------------------------------------------------------
  zap:
    name: OWASP ZAP (DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Serve site
        run: npx serve out -l 8080 &

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: "http://localhost:8080/"
          rules_file_name: ".zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false

  # ------------------------------------------------------------------
  # Deploy — only after lint/audit/build succeed.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
